<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSim — эволюция в браузере</title>
  </head>
  <body>
    <main>
      <section class="stage">
        <canvas id="world"></canvas>
      </section>
      <aside>
        <header>
          <h1>EcoSim</h1>
          <span id="tick" class="muted"></span>
        </header>

        <div class="row">
          <button id="pause">⏸ Пауза</button>
          <button id="reset">↻ Заново</button>
        </div>

        <div class="tools">
          <button data-tool="inspect" class="active" title="Выбрать существо">🔍</button>
          <button data-tool="grass" title="Сажать траву">🌱</button>
          <button data-tool="herb" title="Добавить травоядное">🐇</button>
          <button data-tool="carn" title="Добавить хищника">🦊</button>
        </div>

        <label>Скорость <output id="speed-val"></output>
          <input id="speed" type="range" min="1" max="20" value="1" />
        </label>
        <label>Мутации <output id="mutation-val"></output>
          <input id="mutation" type="range" min="0" max="30" value="8" />
        </label>
        <label>Рост травы <output id="growth-val"></output>
          <input id="growth" type="range" min="10" max="300" value="100" />
        </label>

        <h2>Популяция</h2>
        <canvas id="chart"></canvas>
        <div class="legend">
          <span class="herb">● травоядные</span>
          <span class="carn">● хищники</span>
          <span class="grass">■ трава</span>
        </div>

        <h2>Средние гены</h2>
        <div id="stats"></div>

        <h2>Инспектор</h2>
        <div id="inspector"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
